services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: agritrade-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # NestJS Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agritrade-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Primary DB (Local PostgreSQL container) - All reads/writes
      - PRIMARY_DB_URL=postgresql://postgres:postgres@db:5432/postgres
      # Warehouse (Supabase) - Optional, for data warehouse sync
      # - WAREHOUSE_DB_URL=postgresql://postgres.[PROJECT]:[PASSWORD]@pooler.supabase.com:6543/postgres
      # Sync disabled by default in Docker (no Supabase connection)
      - SYNC_ENABLED=false
      # Legacy support
      - SUPABASE_DB_URL=postgresql://postgres:postgres@db:5432/postgres
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - PORT=3000
    ports:
      - "3001:3000"

volumes:
  postgres_data:
